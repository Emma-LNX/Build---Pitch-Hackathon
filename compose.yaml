services:
  backend:
    build: ./backend
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Completar SUPABASE_DB_URL en .env}
      SUPABASE_DB_USERNAME: ${SUPABASE_DB_USERNAME:?Completar SUPABASE_DB_USERNAME en .env}
      SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?Completar SUPABASE_DB_PASSWORD en .env}
      SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
      SUPABASE_AUTH_ISSUER: ${SUPABASE_AUTH_ISSUER:-${SUPABASE_URL:-http://localhost:54321}/auth/v1}
      REPORT_SMTP_HOST: ${REPORT_SMTP_HOST:-}
      REPORT_SMTP_PORT: ${REPORT_SMTP_PORT:-587}
      REPORT_SMTP_USERNAME: ${REPORT_SMTP_USERNAME:-}
      REPORT_SMTP_PASSWORD: ${REPORT_SMTP_PASSWORD:-}
      REPORT_SMTP_FROM: ${REPORT_SMTP_FROM:-}
      REPORT_SMTP_STARTTLS: ${REPORT_SMTP_STARTTLS:-true}
      REPORT_WEEKLY_CHECK_CRON: "${REPORT_WEEKLY_CHECK_CRON:-0 0 8 * * *}"
      REPORT_WEEKLY_ZONE: ${REPORT_WEEKLY_ZONE:-America/Guatemala}
    expose:
      - "8081"
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
