server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: math-portal
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: math_portal
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: math_portal
    schemas: math_portal
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
