server:
  port: 8081
  servlet:
    context-path: /api

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_AUTH_ISSUER}
          jwk-set-uri: ${SUPABASE_AUTH_ISSUER}/.well-known/jwks.json
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: math-portal
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: math_portal
    hibernate:
      ddl-auto: validate
  flyway:
    default-schema: math_portal
    schemas: math_portal
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
